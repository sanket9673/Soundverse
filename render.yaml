services:
  - type: web
    name: soundverse-play-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.seed_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: soundverse-db
          property: connectionString
      - key: ENV
        value: production
      - key: API_KEY
        value: soundverse-secret-key-2026

databases:
  - name: soundverse-db
    plan: free